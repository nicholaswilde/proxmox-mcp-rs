[package]
name = "proxmox-mcp-rs"
version = "0.3.35"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "cookies",
] }
anyhow = "1.0"
log = "0.4"
url = "2.4"
clap = { version = "4.3", features = ["derive", "env"] }
config = { version = "0.15.19", features = ["toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures = "0.3"
tokio-stream = "0.1"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "6.1" # For managing active SSE sessions
clap_complete = "4.5"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.24.0"
wiremock = "0.6.5"
clap_mangen = "0.2"

# Profile for final production releases (smaller, faster)
[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Link Time Optimization (smaller binary)
codegen-units = 1 # Reduce parallel code generation for better optimization
panic = "abort"   # Remove stack unwinding (smaller binary)
strip = true      # Strip symbols (smaller binary)

# Profile for CI/CD builds (inherits from dev)
[profile.ci]
inherits = "dev"
incremental = false # Disable incremental compilation for CI (often slower/buggy in CI cache)
debug = 0           # No debug info needed for basic CI checks (speeds up build)

[package.metadata.deb]
maintainer = "Nicholas Wilde <ncwilde43@gmail.com>"
copyright = "2026 Nicholas Wilde"
license-file = ["LICENSE", "4"]
extended-description = "A Model Context Protocol (MCP) server for Proxmox Virtual Environment (PVE) and Proxmox Backup Server (PBS)."
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/proxmox-mcp-rs",
    "usr/bin/",
    "755",
  ],
  [
    "assets/man/proxmox-mcp-rs.1",
    "usr/share/man/man1/",
    "644",
  ],
  [
    "assets/completions/proxmox-mcp-rs.bash",
    "usr/share/bash-completion/completions/proxmox-mcp-rs",
    "644",
  ],
  [
    "assets/completions/_proxmox-mcp-rs",
    "usr/share/zsh/vendor-completions/_proxmox-mcp-rs",
    "644",
  ],
  [
    "assets/completions/proxmox-mcp-rs.fish",
    "usr/share/fish/vendor_completions.d/proxmox-mcp-rs.fish",
    "644",
  ],
  [
    "config.toml.example",
    "usr/share/doc/proxmox-mcp-rs/config.toml.example",
    "644",
  ],
  [
    "README.md",
    "usr/share/doc/proxmox-mcp-rs/README.md",
    "644",
  ],
]
